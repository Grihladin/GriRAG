[project]
name = "pixelrag-app"
version = "0.1.0"
description = "Personal visual RAG: documents -> page images -> OpenRouter embeddings -> Qdrant -> vision LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",   # required for uploads
  "httpx==0.28.1",
  "qdrant-client==1.20.0",      # matches the server; search() is gone, use query_points*()
  "pymupdf==1.28.2",            # newest 1.x, no dependencies; AGPL (fine for personal use)
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]              # package = false: without this, `import app` fails at collection
filterwarnings = ["ignore:builtin type (SwigPy|swigvarlink):DeprecationWarning"]
