[project]
name = "grirag"
version = "0.1.0"
description = "Personal visual RAG: documents -> page images -> OpenRouter embeddings -> Qdrant -> vision LLM"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",   # required for uploads
  "httpx==0.28.1",
  "qdrant-client==1.20.0",      # matches the server; search() is gone, use query_points*()
  "pymupdf==1.28.2",            # newest 1.x, no dependencies; AGPL (fine for personal use)
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120                # the code is written to ~120 columns; `ruff format` is not used

[tool.ruff.lint]
extend-select = ["FAST"]         # FastAPI rules, e.g. dependencies declared with Annotated

[tool.pytest.ini_options]
pythonpath = ["."]              # package = false: without this, `import app` fails at collection
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type (SwigPy|swigvarlink):DeprecationWarning",
                  "ignore:Using `httpx` with `starlette.testclient`"]
