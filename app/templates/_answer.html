{% if message %}<p class="muted">{{ message }}</p>{% endif %}
{% if answer %}
<pre class="answer">{{ answer.text }}</pre>
<div class="muted">Answered by {{ answer.model }}</div>
<h4>Sources</h4>
<div class="thumbs">
{% for h in answer.sources %}
  <figure><a href="{{ h.image_url }}" target="_blank"><img src="{{ h.image_url }}" width="220" loading="lazy" alt=""></a>
    <figcaption class="muted">S{{ loop.index }} · {{ h.title }} p. {{ h.page_no }}</figcaption></figure>
{% endfor %}
</div>
{% endif %}
