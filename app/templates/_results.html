{% if message %}<p class="muted">{{ message }}</p>{% endif %}
{% for g in groups %}
<div class="group">
  {% set top = g[0] %}
  <b><a href="{{ top.file_url }}" target="_blank">{{ top.title }}</a></b>
  {% if top.kind == 'url' %}<a class="muted" href="{{ top.source }}" target="_blank" rel="noreferrer">source</a>{% endif %}
  <div class="thumbs">
  {% for h in g %}
    <figure><a href="{{ h.image_url }}" target="_blank"><img src="{{ h.image_url }}" width="220" loading="lazy" alt=""></a>
      <figcaption class="muted">p. {{ h.page_no }} · {{ "%.2f"|format(h.score) }}</figcaption></figure>
  {% endfor %}
  </div>
</div>
{% endfor %}
